<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KKSBJ MYEZ-BOOK</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    /* Spinner Wrapper to center percentage inside ring */
    .spinner-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Pure CSS Infinite Rotating Ring */
    .spinner {
      position: absolute;
      inset: 0;
      border: 4px solid #1e293b;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    /* Percentage Counter Text */
    .counter {
      font-size: 1.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      color: #ffffff;
    }

    /* Horizontal Progress Bar */
    .progress-track {
      width: 220px;
      height: 4px;
      background-color: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: #38bdf8;
      border-radius: 999px;
      transition: width 0.03s linear;
    }

    .label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #94a3b8;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="loader-container" role="status" aria-live="polite">
    <div class="spinner-wrapper">
      <div class="spinner"></div>
      <span id="counter" class="counter">0%</span>
    </div>

    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <span class="label">Loading</span>
  </div>

  <script>
    const counterEl = document.getElementById('counter');
    const progressFillEl = document.getElementById('progress-fill');

    let percent = 0;
    const speedMs = 30; // Lower = faster count, Higher = slower count

    setInterval(() => {
      percent++;

      if (percent > 100) {
        percent = 0;
      }

      counterEl.textContent = `${percent}%`;
      progressFillEl.style.width = `${percent}%`;
    }, speedMs);
  </script>

</body>
</html>
